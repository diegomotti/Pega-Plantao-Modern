<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Início · Pega Plantão</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/components/app-shell.js"></script>
  </head>

  <body class="h-full font-sans text-[15px] text-muted antialiased">
    <div class="flex h-full min-h-screen flex-col">
      <pp-app-header></pp-app-header>

      <div class="relative flex min-h-0 flex-1">
        <pp-app-sidebar></pp-app-sidebar>

        <main class="min-h-0 min-w-0 flex-1 overflow-y-auto" aria-label="Início">
        </main>
      </div>
    </div>

    <!-- support chat -->
    <button
      type="button"
      aria-label="Abrir conversa com o suporte"
      title="Fale com o suporte"
      class="fixed right-5 bottom-5 z-20 grid size-10 place-items-center rounded-full border border-primary-100 bg-white text-primary-500 shadow-[0_2px_10px_rgba(33,79,141,0.12)] transition-colors hover:bg-primary-25 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
      data-help="suporte"
    >
      <pp-icon type="topbar" name="helpDesk" class="size-6"></pp-icon>
    </button>

    <script src="/app.js"></script>
  </body>
</html>
